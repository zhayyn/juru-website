# One restricted pilot only. Keep workspace overage spend at zero and do not add a card.
# Access invitation is generated by Render; never commit or print its value.
services:
  - type: web
    name: juru-website-pilot
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: 'npm ci --include=dev --ignore-scripts && npm run lint && npm run build && npm run test:build && npm test && node --test scripts/pilot-deployment.test.mjs && npm prune --omit=dev --ignore-scripts --package-lock=false'
    startCommand: 'test -n "$RENDER_EXTERNAL_HOSTNAME" && ALLOWED_HOSTS="$RENDER_EXTERNAL_HOSTNAME" npm start'
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PILOT_ACCESS_TOKEN
        generateValue: true
      - key: PILOT_ALLOWED_TARGETS
        value: example.com,pa-semarang.go.id,www.pa-semarang.go.id
      - key: AI_PROVIDER
        value: none
      - key: RANKING_PUBLISH_ENABLED
        value: "false"
